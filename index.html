{id:'s2',name:'กล่องนักอ่าน',need:'ดู/อ่านเนื้อหาในคลัง 1 รายการ',check:()=>Object.keys(S.seen||{}).length>=1},
{id:'s3',name:'กล่องนักเล่น',need:'ทำภารกิจ "เล่นเว็บ 5 นาที" สำเร็จ 1 ครั้ง',check:()=>!!(S.done&&S.done.p1)},
{id:'s4',name:'กล่องนักเสี่ยงโชค',need:'หมุนวงล้อรายวันแล้ว',check:()=>!!(S.done&&S.done.wheel)},
{id:'s5',name:'กล่องขยันสุดๆ',need:'ทำภารกิจให้ครบ 3 อย่างในวันนี้ (ชนิดใดก็ได้)',check:()=>Object.keys(S.done||{}).length>=3}];
function slotCard(slot,i){const done=(S.boxOpen||{})[slot.id];const ok=slot.check();
 return `<div class="card"><div class="row"><div class="gap"><span class="em">🎁</span><div><b class="n">${slot.name}</b><div class="mut">${slot.need}</div></div></div>
 ${done?'<span class="chip ok">เปิดแล้ว ✓</span>':ok?`<button class="btn gold" onclick="openSlot(${i})">เปิดกล่อง</button>`:'<span class="chip wn">ยังไม่ปลดล็อก</span>'}</div></div>`}
function vBox(){return '<div class="mut" style="margin:18px 4px 8px">🎁 กล่องสุ่มประจำวัน · ทำภารกิจให้ครบเพื่อปลดล็อกแต่ละกล่อง · เปิดแล้วมีโอกาสสุ่มเลื่อนระดับ 3 ครั้ง</div>'
 +`<div class="card"><div style="display:flex;gap:4px">${BOX.map(boxMini).join('')}</div></div>`
 +SLOTS.map(slotCard).join('')}
function openSlot(i){const slot=SLOTS[i];if((S.boxOpen||{})[slot.id]||!slot.check())return;
 let tier=pickBoxIndex(),chances=3;
 function reward(){const b=BOX[tier];return Math.floor(Math.random()*(b.max-b.min+1))+b.min}
 function drawTap(){const b=BOX[tier],atMax=tier===BOX.length-1;
  $('#dlg').innerHTML=`<div class="ov" style="align-items:center;justify-content:center;background:${b.c2}"><div style="text-align:center;color:#fff;padding:20px;width:100%;max-width:340px">
  <div style="font-weight:800;letter-spacing:1px;opacity:.9">${b.tag}</div>
  <div style="font-size:13px;opacity:.85;margin-top:2px">${b.name} · ${b.rarity}</div>
  <div style="margin:18px auto;animation:boxshake .5s ease-in-out 1">${chestSVG(b.c1,b.c2,120)}</div>
  ${atMax?`<div style="opacity:.9">ถึงระดับสูงสุดแล้ว!</div><button id="bnext" class="btn" style="width:220px;margin-top:14px;background:#fff;font-weight:700;color:${b.c2}">กดเปิดดูเลย!</button>`
  :`<div style="opacity:.9">เหลือโอกาสอีก ${chances} ครั้ง!</div><button id="bnext" class="btn" style="width:220px;margin-top:14px;background:#fff;font-weight:700;color:${b.c2}">กดเพื่อสุ่มเลื่อนระดับ</button>`}
  </div></div>`;
  $('#bnext').onclick=()=>{if(!atMax){chances--;if(Math.random()<UPGRADE_CHANCE&&tier<BOX.length-1)tier++}
   if(atMax||chances<=0||tier===BOX.length-1)finalize();else drawTap()};}
 function finalize(){const b=BOX[tier],rw=reward();
  $('#dlg').innerHTML=`<div class="ov" style="align-items:center;justify-content:center;background:${b.c2}"><div style="text-align:center;color:#fff;padding:20px">
  <div style="font-weight:800;letter-spacing:1px;opacity:.9">${b.tag}</div>
  <div style="font-size:13px;opacity:.85;margin-top:2px">${b.name} · ${b.rarity}</div>
  <div style="margin:18px auto;animation:boxpop .4s ease-out">${chestSVG(b.c1,b.c2,120)}</div>
  <div style="font-size:36px;font-weight:800;animation:boxpop .35s ease-out">+${fmt(rw)}</div><div style="opacity:.9">คะแนน</div>
  <button id="bok" class="btn" style="width:220px;margin-top:22px;background:#fff;font-weight:700;color:${b.c2}">ไปต่อ</button>
  </div></div>`;
  $('#bok').onclick=()=>{$('#dlg').innerHTML='';S.boxOpen=S.boxOpen||{};S.boxOpen[slot.id]=true;add(rw,'เปิด'+b.name+' ('+slot.name+')');R()};}
 drawTap();}
// ---------- missions ----------
function claim(id){const m=M.find(x=>x.id===id);let n=m.p,t=m.n;
 if(id==='ci'){const y=new Date(Date.now()-864e5).toLocaleDateString('en-CA');S.streak=S.last===y?S.streak+1:1;S.last=day();
  if(S.streak%7===0){n+=5000;t+=' + โบนัสครบ 7 วัน'}}
 S.done[id]=(S.done[id]||0)+1;if(run&&run.id===id)run=null;add(n,t);R()}
function start(id){run={id,el:0};R()}
function stop(){run=null;R()}
function mission(m){const c=(S.done||{})[m.id]||0,full=c>=m.max,r=run&&run.id===m.id;
 const el=m.tot?S.on:(r?run.el:0),ready=m.s===0||el>=m.s;let b;
 if(full)b='<span class="chip ok">ครบวันนี้</span>';
 else if(ready)b=`<button class="btn gold" onclick="claim('${m.id}')">รับ +${fmt(m.p)}</button>`;
 else if(m.tot)b='<span class="chip wn" id="t-'+m.id+'">'+mm(S.on)+' / '+mm(m.s)+'</span>';
 else if(r)b=`<button class="btn" onclick="stop()">หยุด</button>`;
 else b=`<button class="btn pri" onclick="start('${m.id}')">เริ่ม</button>`;
 return `<div class="card"><div class="row"><div class="gap"><span class="em">${m.e}</span><div style="min-width:0"><b class="n">${m.n}</b><div class="mut">${m.d}</div><div class="mut">+${fmt(m.p)} คะแนน · วันนี้ ${c}/${m.max}</div></div></div>${b}</div>
 ${(m.s&&!full&&(r||m.tot))?`<div class="bar"><i id="b-${m.id}" style="width:${Math.min(100,el/m.s*100)}%"></i></div>${r?`<div class="mut" style="margin-top:6px" id="t-${m.id}">${mm(el)} / ${mm(m.s)}</div>`:''}`:''}</div>`}
function spin(){if(S.done.wheel)return;let r=Math.random()*100,p=5;for(const [v,w] of WH){if(r<w){p=v;break}r-=w}S.done.wheel=1;add(p,'หมุนวงล้อรายวัน');R();say('🎡 ได้ '+fmt(p)+' คะแนน!')}
const seenN=()=>Object.keys(S.seen).length;
const MS=[['oid','🆔','ตั้งค่า ROV Open ID','กรอกครั้งแรก',50,()=>S.oid?1:0,1],['s3','🔥','เช็กอินติดกัน 3 วัน','',300,()=>S.streak,3],['s14','🔥','เช็กอินติดกัน 14 วัน','',3000,()=>S.streak,14],['s30','🔥','เช็กอินติดกัน 30 วัน','',10000,()=>S.streak,30],
['c3','📚','ดู/อ่านเนื้อหาในคลัง 3 รายการ','',200,seenN,3],['c10','📚','ดู/อ่านเนื้อหาในคลัง 10 รายการ','',1000,seenN,10],['l10','⏱️','ออนไลน์สะสม 10 ชั่วโมง','',2000,()=>S.life/3600,10],['l50','⏱️','ออนไลน์สะสม 50 ชั่วโมง','',10000,()=>S.life/3600,50]];
function msClaim(id){const m=MS.find(x=>x[0]===id);if(!m||S.ms[id]||m[5]()<m[6])return;S.ms[id]=1;add(m[4],m[2]);R()}
function msCard(m){const [id,e,n,d,p,f,t]=m,c=Math.min(f(),t),ok=c>=t,dn=S.ms[id];
 return `<div class="card"><div class="row"><div class="gap"><span class="em">${e}</span><div style="min-width:0"><b class="n">${n}</b><div class="mut">+${fmt(p)} คะแนน · ${Math.floor(c)}/${t}${d?' · '+d:''}</div></div></div>${dn?'<span class="chip ok">รับแล้ว ✓</span>':ok?`<button class="btn gold" onclick="msClaim('${id}')">รับ +${fmt(p)}</button>`:`<span class="chip">${Math.floor(c/t*100)}%</span>`}</div>${dn||ok?'':`<div class="bar"><i style="width:${c/t*100}%"></i></div>`}</div>`}
function vM(){return '<div class="mut" style="margin:14px 4px 0">เลือก "เริ่ม" แล้วเปิดหน้านี้ค้างไว้ · เวลาจะนับเฉพาะตอนที่อยู่ในหน้านี้ · ทำได้ครั้งละ 1 ภารกิจ</div>'
 +`<div class="card"><div class="row"><div class="gap"><span class="em">🎡</span><div><b class="n">วงล้อรายวัน</b><div class="mut">หมุนได้วันละ 1 ครั้ง · ได้ 5–1,000 คะแนน</div></div></div>${S.done.wheel?'<span class="chip ok">หมุนแล้ววันนี้</span>':'<button class="btn gold" onclick="spin()">หมุน</button>'}</div></div>`+vBox()
 +M.map(mission).join('')+'<div class="mut" style="margin:18px 4px 0">🏆 เป้าหมายสะสม (รับได้ครั้งเดียว)</div>'+MS.map(msCard).join('')}

function vR(){const nx=T.find(t=>S.pts<t[1]);
 let h=`<div class="card"><b class="n">แลกคะแนนเป็นคูปอง ROV</b><div class="mut">${nx?`อีก ${fmt(nx[1]-S.pts)} คะแนน จะแลก ${nx[0]} คูปองได้`:'คะแนนพอแลกได้ทุกระดับแล้ว'}</div></div>`;
 T.forEach(([q,c])=>{const ok=S.pts>=c;h+=`<div class="card"><div class="row"><div class="gap"><span class="em">🎟️</span><div><b class="n">${q} คูปอง</b><div class="mut">${fmt(c)} คะแนน</div></div></div>
 <button class="btn ${ok?'gold':''}" ${ok?'':'disabled'} onclick="redeem(${q},${c})">${ok?'แลกเลย':'คะแนนไม่พอ'}</button></div><div class="bar"><i style="width:${Math.min(100,S.pts/c*100)}%"></i></div><div class="mut" style="margin-top:6px">${fmt(Math.min(S.pts,c))} / ${fmt(c)}</div></div>`});return h}
async function redeem(q,c){if(S.pts<c)return;if(!S.oid){await say('กรอก ROV Open ID ก่อนแลกคูปอง');eo=true;pg='home';R();return}
 if(!(await dlg('ใช้ '+fmt(c)+' คะแนน แลก '+q+' คูปอง\nให้ Open ID: '+S.oid+' ?')))return;if(S.pts<c)return;
 const ch='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',g=n=>Array.from({length:n},()=>ch[Math.floor(Math.random()*ch.length)]).join('');
 const code='ROV-'+g(4)+'-'+g(4);S.my.unshift({t:tstr(),q,code,oid:S.oid});add(-c,'แลก '+q+' คูปอง ('+code+') ID '+S.oid);pg='mine';R()}
function vH(){return `<div class="card"><b class="n">คูปองของฉัน</b>${S.my.length?`<table class="tbl">${S.my.map(x=>`<tr><td>${x.q} คูปอง<div class="mut">${x.t}${x.oid?' · ID '+x.oid:''}</div></td><td align="right"><span class="code">${x.code}</span> <button class="chip" onclick="cp('${x.code}')">คัดลอก</button></td></tr>`).join('')}</table>`:'<div class="mut" style="margin-top:6px">ยังไม่มีคูปอง</div>'}</div>
<div class="card"><b class="n">ประวัติคะแนน</b><table class="tbl">${S.log.map(x=>`<tr><td class="mut" width="90">${x.t}</td><td>${x.m}</td><td align="right"><b style="color:${x.n<0?'#d32f2f':'var(--okt)'}">${x.n>0?'+':''}${fmt(x.n)}</b></td></tr>`).join('')||'<tr><td class="mut">ยังไม่มีประวัติ</td></tr>'}</table></div>`}
let eo=false;
function oidR(){const e=$('#oidc');if(!e||!S||(eo&&$('#oi')))return;
 e.innerHTML=(S.oid&&!eo)?`<div class="row"><div class="gap"><span class="em">🆔</span><div><div class="mut">ROV Open ID ที่รับคูปอง</div><span class="code">${S.oid}</span></div></div><button class="chip" onclick="eo=true;oidR();$('#oi').focus()">แก้ไข</button></div>`
 :`<b class="n">🆔 ROV Open ID</b><div class="mut" style="margin:4px 0 8px">กรอก Open ID ของบัญชี ROV ที่จะรับคูปอง (ต้องกรอกก่อนแลก)</div><div class="row" style="flex-wrap:nowrap"><input id="oi" value="${S.oid||''}" placeholder="เช่น 1234567890" inputmode="text" maxlength="30" class="inp" style="margin-top:0"><button class="btn pri" onclick="saveOid()">บันทึก</button></div>`}
function saveOid(){const v=$('#oi').value.trim();if(!/^[A-Za-z0-9_-]{5,30}$/.test(v)){say('Open ID ต้องเป็นตัวเลข/ตัวอักษร 5-30 ตัว ไม่มีเว้นวรรค');return}
 S.oid=v;eo=false;save();R()}

function fmtDur(sec){sec=Math.floor(sec||0);const d=Math.floor(sec/86400),h=Math.floor(sec%86400/3600),m=Math.floor(sec%3600/60),s=sec%60;
 const parts=[];if(d)parts.push(d+'วัน');if(h||d)parts.push(h+'ชม.');if(m||h||d)parts.push(m+'นาที');parts.push(s+'วิ');return parts.join(' ')}
function medal(i){return i===0?'🥇':i===1?'🥈':i===2?'🥉':'#'+(i+1)}
function rankRow(r,i,val){const me=uid&&r.uid===uid;
 return `<div class="row" style="padding:10px 0;border-top:1px solid var(--line)"><div class="gap"><b class="n" style="width:40px;text-align:center;flex:none">${medal(i)}</b><div style="min-width:0"><b class="n">${esc(r.email||'(ไม่ทราบชื่อ)')}</b>${me?' <span class="chip ok">คุณ</span>':''}${(r.email||'').toLowerCase()===ADMIN_EMAIL.toLowerCase()?' <span class="chip wn">แอดมิน</span>':''}</div></div><b class="n">${val}</b></div>`}

 const byPts=leaderboard.slice().sort((a,b)=>(b.pts||0)-(a.pts||0));
 const byLife=leaderboard.slice().sort((a,b)=>(b.life||0)-(a.life||0));
 const list=rankTab==='pts'?byPts:byLife;

 <div class="card"><div class="mut" style="margin-bottom:4px">${rankTab==='pts'?'เรียงตามคะแนนสะสมทั้งหมด':'เรียงตามเวลาออนไลน์สะสมทั้งหมดบนเว็บนี้'} · แสดงผู้เล่นทุกคนที่เคยสมัคร (${list.length} คน)</div>
 ${list.length?list.map((r,i)=>rankRow(r,i,rankTab==='pts'?fmt(r.pts||0)+' คะแนน':fmtDur(r.life))).join(''):'<div class="mut" style="margin-top:10px">ยังไม่มีข้อมูล</div>'}</div>`}

async function sendContact(){const st=$('#ctst'),bt=$('#ctbtn');const email=$('#ctem').value.trim(),topic=$('#cttp').value,body=$('#ctbd').value.trim(),f=$('#ctim').files[0];
 if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){st.textContent='กรอกอีเมลให้ถูกต้อง';return}
 if(!body){st.textContent='กรอกรายละเอียด';return}
 if(f&&f.size>1.5*1048576){st.textContent='รูปเกิน 1.5MB';return}
 bt.disabled=true;try{let img='';if(f){st.textContent='กำลังแนบรูป...';img=await readB64Img(f)}
  const id='k'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  await db.ref('contacts/'+id).set({email,topic,body,img,ts:firebase.database.ServerValue.TIMESTAMP,uid:uid||''});
  const mailto='mailto:'+ADMIN_EMAIL+'?subject='+encodeURIComponent('['+topic+'] ข้อความจากผู้เล่น ROV Point Hub')+'&body='+encodeURIComponent('จาก: '+email+'\n\n'+body+(img?'\n\n(ผู้เล่นแนบรูปมาด้วย ดูได้ในแผงแอดมิน)':''));
  st.textContent='✅ ส่งเข้าระบบแล้ว กำลังเปิดแอปอีเมลให้ส่งสำเนาถึงแอดมิน...';
  setTimeout(()=>{try{location.href=mailto}catch(e){}},400);
  $('#ctbd').value='';$('#ctim').value=''}
 catch(e){st.textContent='ผิดพลาด: '+((e&&e.code)||'ลองใหม่')}bt.disabled=false}

function showCodeReward(code,data){return new Promise(res=>{
 $('#dlg').innerHTML=`<div class="ov" style="align-items:center;justify-content:center;background:var(--pri)"><div style="text-align:center;color:#fff;padding:20px;width:100%;max-width:340px">
 <div style="font-size:44px">🎁</div>

 <div style="font-size:36px;font-weight:800;margin-top:18px;animation:boxpop .4s ease-out">+${fmt(data.points||0)}</div><div style="opacity:.9">คะแนน</div>

async function redeemCode(){const st=$('#rcst'),bt=$('#rcbtn'),code=$('#rcin').value.trim().toUpperCase().replace(/\s+/g,'');
 if(!code){st.textContent='กรอกโค้ด';return}
 bt.disabled=true;st.textContent='กำลังตรวจสอบโค้ด...';
 const wait=new Promise(r=>setTimeout(r,1500+Math.random()*1500)); // 1.5–3s "checking" suspense
 try{const snap=await db.ref('promocodes/'+code).once('value');const data=snap.val();
  await wait;
  if(!data){st.textContent='ไม่พบโค้ดนี้';bt.disabled=false;return}
  if(data.expiresAt&&Date.now()>data.expiresAt){st.textContent='โค้ดนี้หมดอายุแล้ว';bt.disabled=false;return}
  if(data.usedBy&&data.usedBy[uid]){st.textContent='คุณใช้โค้ดนี้ไปแล้ว';bt.disabled=false;return}
  await db.ref('promocodes/'+code+'/usedBy/'+uid).set(true);
  st.textContent='';
  await showCodeReward(code,data);
  add(data.points||0,'ใช้โค้ด '+code+(data.desc?' ('+data.desc+')':''));
  $('#rcin').value='';R()}
 catch(e){await wait;st.textContent='ผิดพลาด: '+((e&&e.code)||'ลองใหม่')}bt.disabled=false}

async function addContent(){const st=$('#ast'),bt=$('#abtn');const type=$('#at').value,title=$('#ati').value.trim(),body=$('#abd').value.trim(),f=$('#af').files[0];let pts=Math.round(+$('#ap').value),sec=Math.round(+$('#as').value);

 <label class="mut" style="display:block;margin-top:10px">โค้ด</label><div class="row" style="flex-wrap:nowrap;gap:8px"><input id="cdcode" class="inp" style="margin-top:0;text-transform:uppercase" placeholder="เช่น ROVLUCKY10"><button class="btn" onclick="genCode()">สุ่ม</button></div>

function genCode(){const ch='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let v='';for(let i=0;i<8;i++)v+=ch[Math.floor(Math.random()*ch.length)];$('#cdcode').value=v}
async function addCode(){const st=$('#cdst'),bt=$('#cdbtn');let code=$('#cdcode').value.trim().toUpperCase().replace(/\s+/g,'');
 const pts=Math.round(+$('#cdpts').value),desc=$('#cddesc').value.trim(),exp=$('#cdexp').value;
 if(!code){st.textContent='กรอกโค้ด';return}if(!(pts>0)){st.textContent='กรอกคะแนนให้ถูกต้อง (มากกว่า 0)';return}if(!exp){st.textContent='เลือกวันและเวลาหมดอายุ';return}
 const expiresAt=new Date(exp).getTime();if(isNaN(expiresAt)){st.textContent='วันที่ไม่ถูกต้อง';return}
 if(expiresAt<=Date.now()){st.textContent='เวลาหมดอายุต้องอยู่ในอนาคต';return}
 bt.disabled=true;try{const exist=await db.ref('promocodes/'+code).once('value');
  if(exist.val()){st.textContent='มีโค้ดนี้อยู่แล้ว ลองชื่ออื่น';bt.disabled=false;return}
  await db.ref('promocodes/'+code).set({points:pts,desc,expiresAt,createdAt:firebase.database.ServerValue.TIMESTAMP});
  st.textContent='✅ สร้างโค้ด '+code+' แล้ว';$('#cdcode').value='';$('#cddesc').value='';$('#cdexp').value=''}
 catch(e){st.textContent='ผิดพลาด: '+((e&&e.code)||'ลองใหม่')}bt.disabled=false}
const codesList=()=>codes.length?`<table class="tbl">${codes.map(c=>{const used=Object.keys(c.usedBy||{}).length,exp=c.expiresAt?new Date(c.expiresAt):null,isExp=exp&&Date.now()>exp.getTime();
 return `<tr><td><span class="code">${esc(c.code)}</span><div class="mut">+${fmt(c.points||0)} คะแนน${c.desc?' · '+esc(c.desc):''}</div><div class="mut">${isExp?'<span style="color:#d32f2f">หมดอายุแล้ว</span>':exp?'หมดอายุ '+exp.toLocaleString('th-TH',{dateStyle:'short',timeStyle:'short'}):'ไม่มีวันหมดอายุ'} · ใช้ไปแล้ว ${used} คน</div></td><td align="right"><button class="chip" onclick="delCode('${c.code}')">ลบ</button></td></tr>`}).join('')}</table>`:'<div class="mut" style="margin-top:6px">ยังไม่มีโค้ด</div>';
async function delCode(code){if(!(await dlg('ลบโค้ด "'+code+'" ?','ลบ')))return;try{await db.ref('promocodes/'+code).remove()}catch(e){say('ลบไม่สำเร็จ')}}

let attachedUid=null;
function boot(){try{
  fbApp=firebase.initializeApp(FIREBASE_CONFIG);auth=firebase.auth();db=firebase.database();
  auth.onAuthStateChanged(u=>{user=u;
   if(!u){attachedUid=null;detachAll();pg='login';ready=true;R();return}
   uid=u.uid;isAdmin=(u.email||'').toLowerCase()===ADMIN_EMAIL.toLowerCase();
   if(attachedUid===uid){ready=true;return} // auth SDK just re-validated the same session (token refresh, tab refocus, etc.) — nothing actually changed, so don't touch the screen at all
   attachedUid=uid;
   attachUser();attachContent();attachAnnounce();attachLeaderboard();if(isAdmin){attachContacts();attachCodes()}if(pg==='login')pg='home';ready=true;pg==='admin'?head():R()});
 }catch(e){$('#v').innerHTML='<div class="card" style="margin-top:0"><b class="n">เชื่อมต่อ Firebase ไม่สำเร็จ</b><div class="mut" style="margin-top:6px">'+esc((e&&e.message)||'')+'</div></div>'}}
addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flush()});addEventListener('pagehide',flush);
