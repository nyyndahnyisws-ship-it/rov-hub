function attachUser(){userRefOff=db.ref('users/'+uid);
 userRefOff.on('value',snap=>{const v=snap.val();
  if(!v){S=fresh();pushUser(true);roll();pg==='admin'?head():R();return}
  if(S&&typeof v.ts==='number'&&v.ts<=S.ts){markSave(true);return} // echo of our own write — local state already correct, skip re-render so nothing on screen (e.g. a form you're typing in) gets wiped
  const keepRun=run;S=Object.assign(fresh(),v);run=keepRun;roll();pg==='admin'?head():R() // on the admin page a background update only refreshes the header (points/nav), never the form itself
 },e=>{markSave(false)})}

 if(S.bpSeason!==bpSeasonKey()){S.bpSeason=bpSeasonKey();S.bpXP=0;S.bpPremium=false;S.bpClaimedFree={};S.bpClaimedPremium={};save()}}

function pickBoxIndex(){const r=Math.random()*100;let acc=0;for(let i=0;i<BOX.length;i++){acc+=BOX[i].w;if(r<acc)return i}return 0}

{id:'s1',name:'กล่องเช็กอิน',need:'เช็กอินวันนี้ให้เสร็จ',check:()=>!!(S.done&&S.done.ci)},

 +`<div class="card"><div style="display:flex;gap:4px">${BOX.map(boxMini).join('')}</div></div>`
 +SLOTS.map(slotCard).join('')}
function openSlot(i){const slot=SLOTS[i];if((S.boxOpen||{})[slot.id]||!slot.check())return;
 let tier=pickBoxIndex(),chances=3;
 function reward(){const b=BOX[tier];return Math.floor(Math.random()*(b.max-b.min+1))+b.min}
 function drawTap(){const b=BOX[tier],atMax=tier===BOX.length-1;
  $('#dlg').innerHTML=`<div class="ov" style="align-items:center;justify-content:center;background:${b.c2}"><div style="text-align:center;color:#fff;padding:20px;width:100%;max-width:340px">

  <div style="margin:18px auto;animation:boxshake .5s ease-in-out 1">${chestSVG(b.c1,b.c2,120)}</div>
  ${atMax?`<div style="opacity:.9">ถึงระดับสูงสุดแล้ว!</div><button id="bnext" class="btn" style="width:220px;margin-top:14px;background:#fff;font-weight:700;color:${b.c2}">กดเปิดดูเลย!</button>`
  :`<div style="opacity:.9">เหลือโอกาสอีก ${chances} ครั้ง!</div><button id="bnext" class="btn" style="width:220px;margin-top:14px;background:#fff;font-weight:700;color:${b.c2}">กดเพื่อสุ่มเลื่อนระดับ</button>`}
  </div></div>`;
  $('#bnext').onclick=()=>{if(!atMax){chances--;if(Math.random()<UPGRADE_CHANCE&&tier<BOX.length-1)tier++}
   if(atMax||chances<=0||tier===BOX.length-1)finalize();else drawTap()};}
 function finalize(){const b=BOX[tier],rw=reward();
  $('#dlg').innerHTML=`<div class="ov" style="align-items:center;justify-content:center;background:${b.c2}"><div style="text-align:center;color:#fff;padding:20px">

  <div style="font-size:13px;opacity:.85;margin-top:2px">${b.name} · ${b.rarity}</div>
  <div style="margin:18px auto;animation:boxpop .4s ease-out">${chestSVG(b.c1,b.c2,120)}</div>
  <div style="font-size:36px;font-weight:800;animation:boxpop .35s ease-out">+${fmt(rw)}</div><div style="opacity:.9">คะแนน</div>

  st.textContent=added?'✅ เพิ่มแล้ว '+added+' รายการ':'มีครบทุกรายการอยู่แล้ว'}

 T.forEach(([q,c])=>{const ok=S.pts>=c;h+=`<div class="card"><div class="row"><div class="gap"><span class="em">🎟️</span><div><b class="n">${q} คูปอง</b><div class="mut">${fmt(c)} คะแนน</div></div></div>
 <button class="btn ${ok?'gold':''}" ${ok?'':'disabled'} onclick="redeem(${q},${c})">${ok?'แลกเลย':'คะแนนไม่พอ'}</button></div><div class="bar"><i style="width:${Math.min(100,S.pts/c*100)}%"></i></div><div class="mut" style="margin-top:6px">${fmt(Math.min(S.pts,c))} / ${fmt(c)}</div></div>`});return h}
async function redeem(q,c){if(S.pts<c)return;if(!S.oid){await say('กรอก ROV Open ID ก่อนแลกคูปอง');eo=true;pg='home';R();return}
 if(!(await dlg('ใช้ '+fmt(c)+' คะแนน แลก '+q+' คูปอง\nให้ Open ID: '+S.oid+' ?')))return;if(S.pts<c)return;
 const ch='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',g=n=>Array.from({length:n},()=>ch[Math.floor(Math.random()*ch.length)]).join('');
 const code='ROV-'+g(4)+'-'+g(4);S.my.unshift({t:tstr(),q,code,oid:S.oid});add(-c,'แลก '+q+' คูปอง ('+code+') ID '+S.oid);pg='mine';R()}

async function sendContact(){const st=$('#ctst'),bt=$('#ctbtn');const email=$('#ctem').value.trim(),topic=$('#cttp').value,body=$('#ctbd').value.trim(),f=$('#ctim').files[0];
 if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){st.textContent='กรอกอีเมลให้ถูกต้อง';return}
 if(!body){st.textContent='กรอกรายละเอียด';return}
 if(f&&f.size>1.5*1048576){st.textContent='รูปเกิน 1.5MB';return}
 bt.disabled=true;try{let img='';if(f){st.textContent='กำลังแนบรูป...';img=await readB64Img(f)}
  const id='k'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  await db.ref('contacts/'+id).set({email,topic,body,img,ts:firebase.database.ServerValue.TIMESTAMP,uid:uid||''});
  const mailto='mailto:'+ADMIN_EMAIL+'?subject='+encodeURIComponent('['+topic+'] ข้อความจากผู้เล่น ROV Point Hub')+'&body='+encodeURIComponent('จาก: '+email+'\n\n'+body+(img?'\n\n(ผู้เล่นแนบรูปมาด้วย ดูได้ในแผงแอดมิน)':''));
  st.textContent='✅ ส่งถึงแอดมินในระบบแล้ว (กำลังเปิดแอปอีเมล — กดส่งในนั้นด้วยถ้าอยากส่งสำเนาทางอีเมล)';
  setTimeout(()=>{try{location.href=mailto}catch(e){}},400);
  $('#ctbd').value='';$('#ctim').value=''}
 catch(e){st.textContent='ผิดพลาด: '+((e&&e.code)||'ลองใหม่')}bt.disabled=false}

async function redeemCode(){const st=$('#rcst'),bt=$('#rcbtn'),code=$('#rcin').value.trim().toUpperCase().replace(/\s+/g,'');
 if(!code){st.textContent='กรอกโค้ด';return}
 bt.disabled=true;st.textContent='กำลังตรวจสอบโค้ด...';
 const wait=new Promise(r=>setTimeout(r,1500+Math.random()*1500)); // 1.5–3s "checking" suspense
 try{const snap=await db.ref('promocodes/'+code).once('value');const data=snap.val();
  await wait;
  if(!data){st.textContent='ไม่พบโค้ดนี้';bt.disabled=false;return}
  if(data.expiresAt&&Date.now()>data.expiresAt){st.textContent='โค้ดนี้หมดอายุแล้ว';bt.disabled=false;return}
  if(data.usedBy&&data.usedBy[uid]){st.textContent='คุณใช้โค้ดนี้ไปแล้ว';bt.disabled=false;return}
  await db.ref('promocodes/'+code+'/usedBy/'+uid).set(true);
  st.textContent='';
  await showCodeReward(code,data);
  add(data.points||0,'ใช้โค้ด '+code+(data.desc?' ('+data.desc+')':''));
  $('#rcin').value='';R()}
 catch(e){await wait;st.textContent='ผิดพลาด: '+((e&&e.code)||'ลองใหม่')}bt.disabled=false}

function vAdminAnnounce(){return `<div class="card" style="margin-top:0"><b class="n">สร้างประกาศใหม่ (เห็นทันทีที่หน้าแรกของทุกคน)</b>
 <input id="anti" placeholder="หัวข้อประกาศ" maxlength="120" class="inp"><textarea id="anbd" rows="4" placeholder="รายละเอียด" class="inp"></textarea>
 <button class="btn pri" id="anbtn" style="width:100%;margin-top:10px" onclick="addAnnounce()">เผยแพร่ประกาศ</button><div class="mut" id="anst" style="margin-top:6px"></div></div>
 <div class="card"><b class="n">ประกาศที่เผยแพร่แล้ว</b><div id="annlist">${annList()}</div></div>`}
async function addAnnounce(){const st=$('#anst'),bt=$('#anbtn'),title=$('#anti').value.trim(),body=$('#anbd').value.trim();
 if(!title){st.textContent='กรอกหัวข้อ';return}if(!body){st.textContent='กรอกรายละเอียด';return}
 bt.disabled=true;try{const id='a'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  await db.ref('announce/'+id).set({title,body,ts:firebase.database.ServerValue.TIMESTAMP});
  st.textContent='✅ เผยแพร่แล้ว ทุกคนเห็นทันที';$('#anti').value='';$('#anbd').value=''}
 catch(e){st.textContent='ผิดพลาด: '+((e&&e.code)||'ลองใหม่')}bt.disabled=false}
const annList=()=>announce.length?`<table class="tbl">${announce.map(a=>`<tr><td>${esc(a.title)}<div class="mut">${a.ts?new Date(a.ts).toLocaleString('th-TH'):''}</div></td><td align="right"><button class="chip" onclick="delAnnounce('${a.id}')">ลบ</button></td></tr>`).join('')}</table>`:'<div class="mut" style="margin-top:6px">ยังไม่มี</div>';
async function delAnnounce(id){if(!(await dlg('ลบประกาศนี้?','ลบ')))return;try{await db.ref('announce/'+id).remove()}catch(e){say('ลบไม่สำเร็จ')}}
function vAdminContact(){return `<div class="mut" style="margin:2px 4px">ข้อความจากผู้เล่น · กด "ตอบกลับทางอีเมล" จะเปิดแอปอีเมลของคุณพร้อมร่างข้อความ — <b>ต้องกดส่ง (Send) ในแอปอีเมลเองอีกครั้ง</b> ถึงจะถึงผู้เล่นจริง ระบบนี้ส่งอีเมลเองอัตโนมัติไม่ได้</div><div id="ctlist">${ctList()}</div>`}
const ctList=()=>contacts.length?contacts.map(c=>`<div class="card"><div class="row"><span class="chip">${esc(c.topic||'')}</span><span class="mut">${c.ts?new Date(c.ts).toLocaleString('th-TH',{dateStyle:'short',timeStyle:'short'}):''}</span></div>
<div class="mut" style="margin-top:6px">จาก: ${esc(c.email)}</div><div style="margin-top:6px;white-space:pre-wrap">${esc(c.body)}</div>
${c.img?`<img src="${c.img}" style="max-width:160px;border-radius:10px;margin-top:8px" onclick="viewContactImg('${c.id}')">`:''}
<div class="row" style="margin-top:10px;flex-wrap:wrap;gap:8px"><button class="btn pri" onclick="replyContact('${c.id}')">ตอบกลับทางอีเมล</button><button class="chip" onclick="cp('${c.email}')">คัดลอกอีเมล</button><button class="chip" onclick="delContact('${c.id}')">ลบ</button></div></div>`).join(''):'<div class="mut" style="margin-top:6px">ยังไม่มีข้อความ</div>';
async function replyContact(id){const c=contacts.find(x=>x.id===id);if(!c)return;
 if(!(await dlg('จะเปิดแอปอีเมลของคุณ พร้อมร่างข้อความถึง '+c.email+'\n\n⚠️ ต้องกดส่ง (Send) ในแอปอีเมลเองอีกครั้ง ไม่ส่งให้อัตโนมัติ','เปิดแอปอีเมล')))return;
 location.href='mailto:'+c.email+'?subject='+encodeURIComponent('Re: ['+(c.topic||'')+'] ROV Point Hub')+'&body='+encodeURIComponent('เรียนผู้เล่น\n\n\n\n----- ข้อความเดิม -----\n'+c.body)}
function viewContactImg(id){const c=contacts.find(x=>x.id===id);if(c&&c.img)say('<img src="'+c.img+'" style="width:100%;border-radius:10px">')}
async function delContact(id){if(!(await dlg('ลบข้อความนี้?','ลบ')))return;try{await db.ref('contacts/'+id).remove()}catch(e){say('ลบไม่สำเร็จ')}}
function readB64(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}
async function addContent(){const st=$('#ast'),bt=$('#abtn');const type=$('#at').value,title=$('#ati').value.trim(),body=$('#abd').value.trim(),f=$('#af').files[0];let pts=Math.round(+$('#ap').value),sec=Math.round(+$('#as').value);
 if(!title){st.textContent='กรอกหัวข้อ';return}if(type!=='news'&&!f){st.textContent='เลือกไฟล์ก่อน';return}if(type==='news'&&!body){st.textContent='กรอกเนื้อหาข่าว';return}
 if(f&&type==='video'&&!f.type.startsWith('video/')||f&&type==='image'&&!f.type.startsWith('image/')){st.textContent='ชนิดไฟล์ไม่ตรงกับประเภท';return}
 if(!(pts>=5&&pts<=10000)||!(sec>=5&&sec<=7200)){st.textContent='คะแนน 5–10,000 / เวลา 5–7,200 วินาที';return}
 const cap=type==='video'?4:2;if(f&&f.size>cap*1048576){st.textContent='ไฟล์เกิน '+cap+'MB (แพ็กเกจฟรีเก็บไฟล์เล็กเท่านั้น)';return}
 bt.disabled=true;try{const id='c'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);let url='';
  if(f){st.textContent='กำลังแปลงไฟล์...';url=await readB64(f)}
  await db.ref('content/'+id).set({type,title,body,url,pts,sec,ts:firebase.database.ServerValue.TIMESTAMP});
  st.textContent='✅ เผยแพร่แล้ว ผู้เล่นทุกคนเห็นทันที';['#ati','#abd'].forEach(x=>$(x).value='');$('#af').value=''}
 catch(e){st.textContent='ผิดพลาด: '+((e&&e.code)||'ลองใหม่ (ไฟล์อาจใหญ่เกินไป)')}bt.disabled=false}
async function delC(id){const c=content.find(x=>x.id===id);if(!c||!(await dlg('ลบ "'+c.title+'" ? (ลบถาวรจากทุกคน)','ลบ')))return;
 try{await db.ref('content/'+id).remove()}catch(e){say('ลบไม่สำเร็จ: '+((e&&e.code)||'ลองใหม่'))}}

function vAdminCodes(){const I="width:100%;font:15px 'Noto Sans Thai';padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);margin-top:6px";
 return `<div class="card" style="margin-top:0"><b class="n">สร้างโค้ดรับของรางวัล</b><div class="mut" style="margin-top:4px">ผู้เล่นแต่ละคนใช้โค้ดเดียวกันได้คนละ 1 ครั้ง จนกว่าจะหมดอายุ</div>
 <label class="mut" style="display:block;margin-top:10px">โค้ด</label><div class="row" style="flex-wrap:nowrap;gap:8px"><input id="cdcode" class="inp" style="margin-top:0;text-transform:uppercase" placeholder="เช่น ROVLUCKY10"><button class="btn" onclick="genCode()">สุ่ม</button></div>
 <label class="mut" style="display:block;margin-top:10px">คะแนนที่ได้รับ</label><input id="cdpts" type="number" min="1" max="1000000" value="100" class="inp">
 <label class="mut" style="display:block;margin-top:10px">คำอธิบาย (ไม่บังคับ)</label><input id="cddesc" class="inp" placeholder="เช่น โค้ดฉลองเปิดตัว">
 <label class="mut" style="display:block;margin-top:10px">วันและเวลาหมดอายุ</label><input id="cdexp" type="datetime-local" class="inp">
 <button class="btn pri" id="cdbtn" style="width:100%;margin-top:12px" onclick="addCode()">สร้างโค้ด</button><div class="mut" id="cdst" style="margin-top:6px"></div></div>
 <div class="card"><b class="n">โค้ดที่สร้างไว้</b><div id="cdlist">${codesList()}</div></div>`}
function genCode(){const ch='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let v='';for(let i=0;i<8;i++)v+=ch[Math.floor(Math.random()*ch.length)];$('#cdcode').value=v}
async function addCode(){const st=$('#cdst'),bt=$('#cdbtn');let code=$('#cdcode').value.trim().toUpperCase().replace(/\s+/g,'');
 const pts=Math.round(+$('#cdpts').value),desc=$('#cddesc').value.trim(),exp=$('#cdexp').value;
 if(!code){st.textContent='กรอกโค้ด';return}if(!(pts>0)){st.textContent='กรอกคะแนนให้ถูกต้อง (มากกว่า 0)';return}if(!exp){st.textContent='เลือกวันและเวลาหมดอายุ';return}
 const expiresAt=new Date(exp).getTime();if(isNaN(expiresAt)){st.textContent='วันที่ไม่ถูกต้อง';return}
 if(expiresAt<=Date.now()){st.textContent='เวลาหมดอายุต้องอยู่ในอนาคต';return}
 bt.disabled=true;try{const exist=await db.ref('promocodes/'+code).once('value');
  if(exist.val()){st.textContent='มีโค้ดนี้อยู่แล้ว ลองชื่ออื่น';bt.disabled=false;return}
  await db.ref('promocodes/'+code).set({points:pts,desc,expiresAt,createdAt:firebase.database.ServerValue.TIMESTAMP});
  st.textContent='✅ สร้างโค้ด '+code+' แล้ว';$('#cdcode').value='';$('#cddesc').value='';$('#cdexp').value=''}
 catch(e){st.textContent='ผิดพลาด: '+((e&&e.code)||'ลองใหม่')}bt.disabled=false}
const codesList=()=>codes.length?`<table class="tbl">${codes.map(c=>{const used=Object.keys(c.usedBy||{}).length,exp=c.expiresAt?new Date(c.expiresAt):null,isExp=exp&&Date.now()>exp.getTime();
 return `<tr><td><span class="code">${esc(c.code)}</span><div class="mut">+${fmt(c.points||0)} คะแนน${c.desc?' · '+esc(c.desc):''}</div><div class="mut">${isExp?'<span style="color:#d32f2f">หมดอายุแล้ว</span>':exp?'หมดอายุ '+exp.toLocaleString('th-TH',{dateStyle:'short',timeStyle:'short'}):'ไม่มีวันหมดอายุ'} · ใช้ไปแล้ว ${used} คน</div></td><td align="right"><button class="chip" onclick="delCode('${c.code}')">ลบ</button></td></tr>`}).join('')}</table>`:'<div class="mut" style="margin-top:6px">ยังไม่มีโค้ด</div>';
async function delCode(code){if(!(await dlg('ลบโค้ด "'+code+'" ?','ลบ')))return;try{await db.ref('promocodes/'+code).remove()}catch(e){say('ลบไม่สำเร็จ')}}

function passCount(){if(typeof isAdmin!=='undefined'&&isAdmin)return 99;return Math.max((S&&S.bpPasses)||0,(S&&S.bpPremium)?1:0)}
function vipUnlocked(k){return k>=1&&k<=6&&passCount()>=VIPT[k-1]}
function vipTop(){let t=0;for(let k=1;k<=6;k++)if(vipUnlocked(k))t=k;return t}
function vipShow(){const v=S&&S.vipSel;return(v===undefined||v===null)?vipTop():(v===0?0:(vipUnlocked(v)?v:vipTop()))}
function plateShow(){const v=S&&S.plateSel;return(v===undefined||v===null)?vipTop():(v===0?0:(vipUnlocked(v)?v:vipTop()))}
function setVip(k){S.vipSel=k;save();R()}
function setPlate(k){S.plateSel=k;save();R()}
const vipImg=(k,h)=>k?`<img class="vipi" src="${VIPI.v[k-1]}" alt="VIP ${k}" style="height:${h||30}px">`:'';
const plateImg=(k,h)=>k?`<img class="plti" src="${VIPI.p[k-1]}" alt="" style="height:${h||34}px">`:'';
function myTitles(){const m={};(S.inventory||[]).forEach(x=>{if(x&&x.desc&&String(x.desc).indexOf('เวอร์พาส Lv.')===0)m[x.name]=1});return Object.keys(m)}
function setTitle(i){const t=myTitles();S.title=i<0?'':(t[i]||'');save();R()}
function vipSettings(){const pc=passCount(),adm=typeof isAdmin!=='undefined'&&isAdmin;
 const grid=(kind)=>`<div class="vgrid">${[1,2,3,4,5,6].map(k=>{const ok=vipUnlocked(k),on=(kind==='v'?vipShow():plateShow())===k;
  return `<button class="vcell ${ok?'':'lk'} ${on?'on':''}" onclick="${ok?(kind==='v'?'setVip('+(on?0:k)+')':'setPlate('+(on?0:k)+')'):"say('ต้องสะสมเวอร์พาสพรีเมียมให้ครบ "+VIPT[k-1]+" พาส')"}">${kind==='v'?vipImg(k,52):plateImg(k,40)}<span>${kind==='v'?'ยศ VIP '+k:'ป้ายซีซั่น '+k}</span><small>${on?'กำลังใช้':ok?'ปลดล็อกแล้ว':'ต้องสะสม '+VIPT[k-1]+' พาส'}</small></button>`}).join('')}</div>`;
 return `<div class="card" style="margin-top:0"><b class="n">ยศเวอร์พาส (VIP)</b><div class="mut" style="margin-top:4px">แสดงยศของคุณข้างชื่อในอันดับ · สะสมการซื้อเวอร์พาสพรีเมียมแล้ว <b>${adm?'ทุกพาส (แอดมิน)':pc+' พาส'}</b> · กดซ้ำที่ยศที่ใช้อยู่เพื่อซ่อน</div>${grid('v')}</div>
 <div class="card"><b class="n">ป้ายชื่อซีซั่นเวอร์พาส</b><div class="mut" style="margin-top:4px">ใช้เงื่อนไขการปลดล็อกเดียวกับยศ VIP แสดงใต้ชื่อในอันดับ</div>${grid('p')}</div>`}
function vSettings(){const ts=myTitles();
 return vipSettings()+`<div class="card" style="margin-top:0"><b class="n">ยศและป้ายชื่อ</b><div class="mut" style="margin-top:4px">ไอเทมที่ได้จากเวอร์พาส (เช่น ไอเทมตำนานประจำซีซั่น) ใช้เป็นยศแสดงข้างชื่อในหน้าอันดับได้ ผู้เล่นที่มียศจะมีป้ายชื่อเรืองแสงในอันดับ</div>${ts.length?ts.map((t,i)=>`<div class="row" style="margin-top:10px"><span class="ttl">${esc(t)}</span>${S.title===t?'<button class="btn" onclick="setTitle(-1)">ถอดยศ</button>':'<button class="btn pri" onclick="setTitle('+i+')">สวมใส่</button>'}</div>`).join(''):'<div class="mut" style="margin-top:8px">ยังไม่มียศ — รับไอเทมจากรางวัลเวอร์พาสเพื่อปลดล็อก</div>'}</div>`
 +`<div class="card" style="margin-top:0"><b class="n">คลังธีม UI</b><div class="mut" style="margin-top:4px">ธีมที่ปลดล็อกแล้วเลือกใช้ได้ทันที ${isAdmin?'(แอดมินปลดล็อกทุกธีมอัตโนมัติ)':'ปลดล็อกธีมใหม่ได้จากรางวัลเวอร์พาส'}</div></div>`
 +THEMES.map(t=>{const ok=themeOk(t.id),on=(S.theme||'default')===t.id||(t.id==='default'&&!S.theme);
  return `<div class="card"><div class="row" style="align-items:flex-start;gap:12px"><div style="width:84px;height:64px;border-radius:12px;border:1px solid var(--line);flex:none;background:${t.sw}"></div><div style="flex:1;min-width:0"><b class="n">${t.name}</b><div class="mut" style="margin-top:2px">${t.desc}</div></div></div>
  <div class="row" style="margin-top:10px">${on?'<span class="chip ok">กำลังใช้งาน</span>':ok?'<span class="chip">ปลดล็อกแล้ว</span>':'<span class="chip wn">ยังไม่ปลดล็อก</span>'}${ok&&!on?`<button class="btn pri" onclick="setTheme('${t.id}')">เลือกใช้ธีมนี้</button>`:''}${!ok?'<span class="mut">ได้จากเวอร์พาสเลเวล 70</span>':''}</div></div>`}).join('')
 +`<div class="card"><div class="row"><div><b class="n">บัญชี</b><div class="mut">${esc((user&&user.email)||'')}</div></div><button class="btn" onclick="logout()">ออกจากระบบ</button></div></div>`}
