<div class="card"><b class="n">ประวัติคะแนน/เหรียญทอง/หยกเขียว</b><table class="tbl">${S.log.map(x=>`<tr><td class="mut" width="90">${x.t}</td><td>${x.cur==='gold'?'🪙':x.cur==='jade'?'💎':'⭐'} ${x.m}</td><td align="right"><b style="color:${x.n<0?'#d32f2f':'var(--okt)'}">${x.n>0?'+':''}${fmt(x.n)}</b></td></tr>`).join('')||'<tr><td class="mut">ยังไม่มีประวัติ</td></tr>'}</table></div>`}

function fmtDur(sec){sec=Math.floor(sec||0);const d=Math.floor(sec/86400),h=Math.floor(sec%86400/3600),m=Math.floor(sec%3600/60),s=sec%60;
 const parts=[];if(d)parts.push(d+'วัน');if(h||d)parts.push(h+'ชม.');if(m||h||d)parts.push(m+'นาที');parts.push(s+'วิ');return parts.join(' ')}

function vMoreF(){const it=[['settings','ตั้งค่า / คลังธีม UI'],['bp','เวอร์พาส'],['redeem','แลกคูปอง'],['redeemcode','กรอกโค้ดรับของรางวัล'],['shop','ร้านค้า (เหรียญทอง)'],['topup','เติมหยกเขียว'],['mine','คูปองและประวัติ'],['contact','ติดต่อแอดมิน'],['admin','หน้าแอดมิน'],['guide','วิธีใช้งาน']];
 return `<div class="mhero"><img src="${MORE_IMG.hero}" alt="เมนูเพิ่มเติม"></div>`+[['profile','โปรไฟล์ของฉัน','user'],['chats','ช่องแชท','mail'],['friends','เพื่อน','star']].map(([k,t,ic])=>`<button class="mrow" onclick="go('${k}')"><span class="mi" style="display:grid;place-items:center;font-size:34px;color:#9fc4ff;width:90px">${fi2(ic)}</span><b>${t}${k==='chats'?chatBadge():''}</b><span class="mc">${fi2('chev')}</span></button>`).join('')+it.map(([k,t],i)=>{if(k==='admin'&&!isAdmin)return'';return `<button class="mrow" onclick="${k==='guide'?'guide(1)':"go('"+k+"')"}"><span class="mi" style="background-image:url(${MORE_IMG.icons[i]})"></span><b>${t}</b><span class="mc">${fi2('chev')}</span></button>`}).join('')
 +`<div class="card"><div class="row"><div style="min-width:0"><b class="n" style="word-break:break-all">${esc((user&&user.email)||'')}</b><div class="mut">${isAdmin?'สิทธิ์แอดมิน':'ผู้เล่น'}</div></div><button class="btn" onclick="logout()">ออกจากระบบ</button></div></div>`}
function vMore(){if(FX())return vMoreF();const b=(k,e,t)=>`<button class="menu" style="width:100%;flex-direction:row;align-items:center;gap:12px" onclick="${k}"><span class="em">${e}</span><b>${t}</b></button>`;
 return `<div class="card" style="margin-top:0"><div class="row"><div class="gap"><span class="em">👤</span><div><b class="n">${esc((user&&user.email)||'')}</b><div class="mut">${isAdmin?'สิทธิ์แอดมิน (อีเมลนี้ถูกกำหนดไว้ล่วงหน้า)':'ผู้เล่น'}</div></div></div><button class="btn" onclick="logout()">ออกจากระบบ</button></div></div>
 <div class="card" style="margin-top:0;display:grid;gap:10px">${b("go('profile')",'👤','โปรไฟล์ของฉัน')}${b("go('chats')",'💬','ช่องแชท'+chatBadge())}${b("go('friends')",'🤝','เพื่อน')}${b("go('settings')",'⚙️','ตั้งค่า / คลังธีม UI')}${b("go('bp')",'🎫','เวอร์พาส')}${b("go('redeem')",'🎟️','แลกคูปอง')}${b("go('redeemcode')",'🎁','กรอกโค้ดรับของรางวัล')}${b("go('shop')",'🛒','ร้านค้า (เหรียญทอง)')}${b("go('topup')",'💎','เติมหยกเขียว')}${b("go('mine')",'🧾','คูปองและประวัติ')}${b("go('contact')",'📬','ติดต่อแอดมิน')}${isAdmin?b("go('admin')",'🛠️','หน้าแอดมิน'):''}${b('guide(1)','❓','วิธีใช้งาน')}</div>`}

// ---------- contact admin (player side) ----------
function readB64Img(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}
function vContact(){return `<div class="card" style="margin-top:0"><b class="n">ติดต่อแอดมิน</b><div class="mut" style="margin-top:4px">กรอกอีเมลที่ให้แอดมินติดต่อกลับ เลือกหัวข้อ อธิบายรายละเอียด แนบรูปได้ถ้าต้องการ — ข้อความจะเข้าระบบให้แอดมินเห็นทันที และจะเปิดแอปอีเมลของคุณให้ด้วย (ต้องกดส่งเองอีกครั้งถ้าอยากส่งสำเนาทางอีเมล ไม่บังคับ)</div>
<label class="mut">อีเมลติดต่อกลับ</label><input id="ctem" type="email" class="inp" placeholder="you@example.com" value="${esc((user&&user.email)||'')}">
<label class="mut" style="display:block;margin-top:10px">หัวข้อ</label><select id="cttp" class="inp"><option>ปัญหาการใช้งาน</option><option>ปัญหาคะแนน/คูปอง</option><option>รายงานผู้เล่นทุจริต</option><option>ข้อเสนอแนะ</option><option>อื่นๆ</option></select>
<label class="mut" style="display:block;margin-top:10px">รายละเอียด</label><textarea id="ctbd" rows="5" class="inp" placeholder="อธิบายปัญหาหรือคำถามของคุณ"></textarea>
<label class="mut" style="display:block;margin-top:10px">แนบรูป (ถ้ามี)</label><input id="ctim" type="file" accept="image/png,image/jpeg,image/webp" class="inp"><div class="mut" style="margin-top:4px">ไม่เกิน 1.5MB · หมายเหตุ: รูปจะแนบไปกับระบบเท่านั้น อีเมลที่เปิดขึ้นไม่รองรับไฟล์แนบ</div>
<div class="mut" id="ctst" style="margin-top:8px"></div>
<button class="btn pri" id="ctbtn" style="width:100%;margin-top:6px" onclick="sendContact()">ส่งข้อความ</button></div>`}
async function sendContact(){const st=$('#ctst'),bt=$('#ctbtn');const email=$('#ctem').value.trim(),topic=$('#cttp').value,body=$('#ctbd').value.trim(),f=$('#ctim').files[0];
 if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){st.textContent='กรอกอีเมลให้ถูกต้อง';return}
 if(!body){st.textContent='กรอกรายละเอียด';return}
 if(f&&f.size>1.5*1048576){st.textContent='รูปเกิน 1.5MB';return}
 bt.disabled=true;try{let img='';if(f){st.textContent='กำลังแนบรูป...';img=await readB64Img(f)}
  const id='k'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  await db.ref('contacts/'+id).set({email,topic,body,img,ts:firebase.database.ServerValue.TIMESTAMP,uid:uid||''});
  const mailto='mailto:'+ADMIN_EMAIL+'?subject='+encodeURIComponent('['+topic+'] ข้อความจากผู้เล่น ROV Point Hub')+'&body='+encodeURIComponent('จาก: '+email+'\n\n'+body+(img?'\n\n(ผู้เล่นแนบรูปมาด้วย ดูได้ในแผงแอดมิน)':''));
  st.textContent='✅ ส่งถึงแอดมินในระบบแล้ว (กำลังเปิดแอปอีเมล — กดส่งในนั้นด้วยถ้าอยากส่งสำเนาทางอีเมล)';
  setTimeout(()=>{try{location.href=mailto}catch(e){}},400);
  $('#ctbd').value='';$('#ctim').value=''}
 catch(e){st.textContent='ผิดพลาด: '+((e&&e.code)||'ลองใหม่')}bt.disabled=false}

function vRedeemCode(){return `<div class="card" style="margin-top:0"><b class="n">กรอกโค้ดรับของรางวัล</b><div class="mut" style="margin-top:4px">กรอกโค้ดที่แอดมินแจก เพื่อรับคะแนนทันที โค้ดแต่ละอันใช้ได้คนละ 1 ครั้งและอาจมีวันหมดอายุ</div>
<label class="mut" style="display:block;margin-top:10px">โค้ด</label><input id="rcin" class="inp" placeholder="เช่น ROV2026" style="text-transform:uppercase">
<div class="mut" id="rcst" style="margin-top:8px"></div>
<button class="btn gold" id="rcbtn" style="width:100%;margin-top:6px" onclick="redeemCode()">ใช้โค้ด</button></div>`}
function showCodeReward(code,data){return new Promise(res=>{
 $('#dlg').innerHTML=`<div class="ov" style="align-items:center;justify-content:center;background:var(--pri)"><div style="text-align:center;color:#fff;padding:20px;width:100%;max-width:340px">
 <div style="font-size:44px">🎁</div>
 <div style="font-weight:800;letter-spacing:1px;margin-top:6px">ใช้โค้ดสำเร็จ!</div>
 <div style="font-size:13px;opacity:.85;margin-top:4px">โค้ด ${esc(code)}${data.desc?' · '+esc(data.desc):''}</div>
 <div style="font-size:36px;font-weight:800;margin-top:18px;animation:boxpop .4s ease-out">+${fmt(data.points||0)}</div><div style="opacity:.9">คะแนน</div>

function shrinkImg(f,maxW,q){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{const k=Math.min(1,maxW/im.width),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};im.src=r.result};r.readAsDataURL(f)})}
async function addAnnounce(){const st=$('#anst'),bt=$('#anbtn'),title=$('#anti').value.trim(),body=$('#anbd').value.trim(),f=$('#anim').files[0],to=$('#anto').value;
 if(!title){st.textContent='กรอกหัวข้อ';return}if(!body&&!f){st.textContent='กรอกรายละเอียด หรือเลือกภาพป้ายประกาศ';return}
 bt.disabled=true;try{const id='a'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  const d={title,body,ts:firebase.database.ServerValue.TIMESTAMP};if(to)d.to=to;
  if(f){st.textContent='กำลังย่อภาพ...';d.img=await shrinkImg(f,1400,.85);if(d.img.length>900000)d.img=await shrinkImg(f,1000,.75)}
  await db.ref('announce/'+id).set(d);S.annRead=Math.max(S.annRead||0,Date.now()+60000);save();
  st.textContent='✅ เผยแพร่แล้ว ทุกคนเห็นทันที';$('#anti').value='';$('#anbd').value='';$('#anim').value='';$('#anto').value=''}
 catch(e){st.textContent='ผิดพลาด: '+((e&&e.code)||'ลองใหม่')}bt.disabled=false}
const annList=()=>announce.length?`<table class="tbl">${announce.map(a=>`<tr><td>${a.img?`<img src="${a.img}" style="width:100%;max-width:220px;border-radius:10px;display:block;margin-bottom:6px">`:''}${esc(a.title)}${a.to?` <span class="chip">→ ${esc((BN_TARGETS.find(t=>t[0]===a.to)||[0,a.to])[1])}</span>`:''}<div class="mut">${a.ts?new Date(a.ts).toLocaleString('th-TH'):''}</div></td><td align="right"><button class="chip" onclick="delAnnounce('${a.id}')">ลบ</button></td></tr>`).join('')}</table>`:'<div class="mut" style="margin-top:6px">ยังไม่มี</div>';

<div class="mut" style="margin-top:6px">จาก: ${esc(c.email)}</div><div style="margin-top:6px;white-space:pre-wrap">${esc(c.body)}</div>
${c.img?`<img src="${c.img}" style="max-width:160px;border-radius:10px;margin-top:8px" onclick="viewContactImg('${c.id}')">`:''}
<div class="row" style="margin-top:10px;flex-wrap:wrap;gap:8px"><button class="btn pri" onclick="replyContact('${c.id}')">ตอบกลับทางอีเมล</button><button class="chip" onclick="cp('${c.email}')">คัดลอกอีเมล</button>${c.target?`<button class="chip" onclick="adminOpenPlayer('${c.target}')">จัดการผู้เล่นนี้</button>`:''}<button class="chip" onclick="delContact('${c.id}')">ลบ</button></div></div>`).join(''):'<div class="mut" style="margin-top:6px">ยังไม่มีข้อความ</div>';
async function replyContact(id){const c=contacts.find(x=>x.id===id);if(!c)return;

 location.href='mailto:'+c.email+'?subject='+encodeURIComponent('Re: ['+(c.topic||'')+'] ROV Point Hub')+'&body='+encodeURIComponent('เรียนผู้เล่น\n\n\n\n----- ข้อความเดิม -----\n'+c.body)}

function readB64(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}
async function addContent(){const st=$('#ast'),bt=$('#abtn');const type=$('#at').value,title=$('#ati').value.trim(),body=$('#abd').value.trim(),f=$('#af').files[0];let pts=Math.round(+$('#ap').value),sec=Math.round(+$('#as').value);
 if(!title){st.textContent='กรอกหัวข้อ';return}if(type!=='news'&&!f){st.textContent='เลือกไฟล์ก่อน';return}if(type==='news'&&!body){st.textContent='กรอกเนื้อหาข่าว';return}
 if(f&&type==='video'&&!f.type.startsWith('video/')||f&&type==='image'&&!f.type.startsWith('image/')){st.textContent='ชนิดไฟล์ไม่ตรงกับประเภท';return}
 if(!(pts>=5&&pts<=10000)||!(sec>=5&&sec<=7200)){st.textContent='คะแนน 5–10,000 / เวลา 5–7,200 วินาที';return}
 const cap=type==='video'?4:2;if(f&&f.size>cap*1048576){st.textContent='ไฟล์เกิน '+cap+'MB (แพ็กเกจฟรีเก็บไฟล์เล็กเท่านั้น)';return}
 bt.disabled=true;try{const id='c'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);let url='';
  if(f){st.textContent='กำลังแปลงไฟล์...';url=await readB64(f)}
  const rec={type,title,body,url,pts,sec,ts:firebase.database.ServerValue.TIMESTAMP};if(type==='video'&&url){st.textContent='กำลังสร้างหน้าปก...';const th=await genThumb(url);if(th)rec.thumb=th}
  await db.ref('content/'+id).set(rec);
  st.textContent='✅ เผยแพร่แล้ว ผู้เล่นทุกคนเห็นทันที';['#ati','#abd'].forEach(x=>$(x).value='');$('#af').value=''}
 catch(e){st.textContent='ผิดพลาด: '+((e&&e.code)||'ลองใหม่ (ไฟล์อาจใหญ่เกินไป)')}bt.disabled=false}
async function delC(id){const c=content.find(x=>x.id===id);if(!c||!(await dlg('ลบ "'+c.title+'" ? (ลบถาวรจากทุกคน)','ลบ')))return;
 try{await db.ref('content/'+id).remove()}catch(e){say('ลบไม่สำเร็จ: '+((e&&e.code)||'ลองใหม่'))}}

 return `<div class="card" style="margin-top:0"><b class="n">สร้างโค้ดรับของรางวัล</b><div class="mut" style="margin-top:4px">ผู้เล่นแต่ละคนใช้โค้ดเดียวกันได้คนละ 1 ครั้ง จนกว่าจะหมดอายุ</div>

function genCode(){const ch='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let v='';for(let i=0;i<8;i++)v+=ch[Math.floor(Math.random()*ch.length)];$('#cdcode').value=v}
async function addCode(){const st=$('#cdst'),bt=$('#cdbtn');let code=$('#cdcode').value.trim().toUpperCase().replace(/\s+/g,'');
 const pts=Math.round(+$('#cdpts').value),desc=$('#cddesc').value.trim(),exp=$('#cdexp').value;
 if(!code){st.textContent='กรอกโค้ด';return}if(!(pts>0)){st.textContent='กรอกคะแนนให้ถูกต้อง (มากกว่า 0)';return}if(!exp){st.textContent='เลือกวันและเวลาหมดอายุ';return}
 const expiresAt=new Date(exp).getTime();if(isNaN(expiresAt)){st.textContent='วันที่ไม่ถูกต้อง';return}
 if(expiresAt<=Date.now()){st.textContent='เวลาหมดอายุต้องอยู่ในอนาคต';return}
 bt.disabled=true;try{const exist=await db.ref('promocodes/'+code).once('value');
  if(exist.val()){st.textContent='มีโค้ดนี้อยู่แล้ว ลองชื่ออื่น';bt.disabled=false;return}
  await db.ref('promocodes/'+code).set({points:pts,desc,expiresAt,createdAt:firebase.database.ServerValue.TIMESTAMP});
  st.textContent='✅ สร้างโค้ด '+code+' แล้ว';$('#cdcode').value='';$('#cddesc').value='';$('#cdexp').value=''}
 catch(e){st.textContent='ผิดพลาด: '+((e&&e.code)||'ลองใหม่')}bt.disabled=false}
const codesList=()=>codes.length?`<table class="tbl">${codes.map(c=>{const used=Object.keys(c.usedBy||{}).length,exp=c.expiresAt?new Date(c.expiresAt):null,isExp=exp&&Date.now()>exp.getTime();
 return `<tr><td><span class="code">${esc(c.code)}</span><div class="mut">+${fmt(c.points||0)} คะแนน${c.desc?' · '+esc(c.desc):''}</div><div class="mut">${isExp?'<span style="color:#d32f2f">หมดอายุแล้ว</span>':exp?'หมดอายุ '+exp.toLocaleString('th-TH',{dateStyle:'short',timeStyle:'short'}):'ไม่มีวันหมดอายุ'} · ใช้ไปแล้ว ${used} คน</div></td><td align="right"><button class="chip" onclick="delCode('${c.code}')">ลบ</button></td></tr>`}).join('')}</table>`:'<div class="mut" style="margin-top:6px">ยังไม่มีโค้ด</div>';
async function delCode(code){if(!(await dlg('ลบโค้ด "'+code+'" ?','ลบ')))return;try{await db.ref('promocodes/'+code).remove()}catch(e){say('ลบไม่สำเร็จ')}}

function passCount(){if(typeof isAdmin!=='undefined'&&isAdmin)return 99;return Math.max((S&&S.bpPasses)||0,(S&&S.bpPremium)?1:0)}
function vipUnlocked(k){return k>=1&&k<=6&&passCount()>=VIPT[k-1]}
function vipTop(){let t=0;for(let k=1;k<=6;k++)if(vipUnlocked(k))t=k;return t}
function vipShow(){const v=S&&S.vipSel;return(v===undefined||v===null)?vipTop():(v===0?0:(vipUnlocked(v)?v:vipTop()))}
function plateShow(){const v=S&&S.plateSel;return(v===undefined||v===null)?vipTop():(v===0?0:(vipUnlocked(v)?v:vipTop()))}
function setVip(k){S.vipSel=k;save();R()}
function setPlate(k){S.plateSel=k;save();R()}
const vipImg=(k,h)=>k?`<img class="vipi" src="${VIPI.v[k-1]}" alt="VIP ${k}" style="height:${h||30}px">`:'';
const plateImg=(k,h)=>k?`<img class="plti" src="${VIPI.p[k-1]}" alt="" style="height:${h||34}px">`:'';
function myTitles(){const m={};(S.inventory||[]).forEach(x=>{if(x&&x.desc&&String(x.desc).indexOf('เวอร์พาส Lv.')===0)m[x.name]=1});return Object.keys(m)}
function setTitle(i){const t=myTitles();S.title=i<0?'':(t[i]||'');save();R()}
function vipSettings(){const pc=passCount(),adm=typeof isAdmin!=='undefined'&&isAdmin;
 const grid=(kind)=>`<div class="vgrid">${[1,2,3,4,5,6].map(k=>{const ok=vipUnlocked(k),on=(kind==='v'?vipShow():plateShow())===k;
  return `<button class="vcell ${ok?'':'lk'} ${on?'on':''}" onclick="${ok?(kind==='v'?'setVip('+(on?0:k)+')':'setPlate('+(on?0:k)+')'):"say('ต้องสะสมเวอร์พาสพรีเมียมให้ครบ "+VIPT[k-1]+" พาส')"}">${kind==='v'?vipImg(k,52):plateImg(k,40)}<span>${kind==='v'?'ยศ VIP '+k:'ป้ายซีซั่น '+k}</span><small>${on?'กำลังใช้':ok?'ปลดล็อกแล้ว':'ต้องสะสม '+VIPT[k-1]+' พาส'}</small></button>`}).join('')}</div>`;
 return `<div class="card" style="margin-top:0"><b class="n">ยศเวอร์พาส (VIP)</b><div class="mut" style="margin-top:4px">แสดงยศของคุณข้างชื่อในอันดับ · สะสมการซื้อเวอร์พาสพรีเมียมแล้ว <b>${adm?'ทุกพาส (แอดมิน)':pc+' พาส'}</b> · กดซ้ำที่ยศที่ใช้อยู่เพื่อซ่อน</div>${grid('v')}</div>
 <div class="card"><b class="n">ป้ายชื่อซีซั่นเวอร์พาส</b><div class="mut" style="margin-top:4px">ใช้เงื่อนไขการปลดล็อกเดียวกับยศ VIP แสดงใต้ชื่อในอันดับ</div>${grid('p')}</div>`}
function vSettings(){const ts=myTitles();
 return vipSettings()+`<div class="card" style="margin-top:0"><b class="n">ยศและป้ายชื่อ</b><div class="mut" style="margin-top:4px">ไอเทมที่ได้จากเวอร์พาส (เช่น ไอเทมตำนานประจำซีซั่น) ใช้เป็นยศแสดงข้างชื่อในหน้าอันดับได้ ผู้เล่นที่มียศจะมีป้ายชื่อเรืองแสงในอันดับ</div>${ts.length?ts.map((t,i)=>`<div class="row" style="margin-top:10px"><span class="ttl">${esc(t)}</span>${S.title===t?'<button class="btn" onclick="setTitle(-1)">ถอดยศ</button>':'<button class="btn pri" onclick="setTitle('+i+')">สวมใส่</button>'}</div>`).join(''):'<div class="mut" style="margin-top:8px">ยังไม่มียศ — รับไอเทมจากรางวัลเวอร์พาสเพื่อปลดล็อก</div>'}</div>`
