<script>
const FIREBASE_CONFIG={apiKey:"AIzaSyDnd949B306VQztn-Rh41nNMyaJcB10or8",authDomain:"curov-355d1.firebaseapp.com",databaseURL:"https://curov-355d1-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"curov-355d1",storageBucket:"curov-355d1.firebasestorage.app",messagingSenderId:"811437937433",appId:"1:811437937433:web:6a2a85c02c9c17e3856b88"};
const ADMIN_EMAIL='sakkrin611@gmail.com';
const M=[
{id:'ci',e:'📅',n:'เช็กอินรายวัน',d:'เข้าเว็บทุกวัน · ครบ 7 วันติดต่อกันรับโบนัส 5,000',p:100,s:0,max:1},

{id:'p2',e:'🔥',n:'เล่นเว็บ 30 นาที',d:'ภารกิจใหญ่ คะแนนสูง',p:1000,s:1800,max:2},
{id:'big',e:'👑',n:'ออนไลน์ครบ 2 ชั่วโมงในวันเดียว',d:'นับเวลาที่เปิดเว็บรวมทั้งวัน',p:10000,s:7200,max:1,tot:1}];
const T=[[5,100000],[10,300000],[50,1000000],[100,10000000]];
const WH=[[5,50],[20,25],[50,14],[100,7],[500,3],[1000,1]];
const fmt=n=>n.toLocaleString('en-US'),day=()=>new Date().toLocaleDateString('en-CA');
const $=s=>document.querySelector(s),p2=x=>String(x).padStart(2,'0'),mm=s=>p2(Math.floor(s/60))+':'+p2(s%60);
const clone=o=>JSON.parse(JSON.stringify(o));
const esc=x=>String(x==null?'':x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ico=t=>({video:'🎬',news:'📰',image:'🖼️'}[t]||'📄'),tn=t=>({video:'วิดีโอ',news:'ข่าว',image:'รูปภาพ'}[t]||'');
const tstr=()=>{const d=new Date();return p2(d.getDate())+'/'+p2(d.getMonth()+1)+' '+p2(d.getHours())+':'+p2(d.getMinutes())};
const fresh=()=>({pts:0,day:day(),done:{},on:0,streak:0,last:null,log:[],my:[],oid:'',cp:{},seen:{},ms:{},life:0,ts:0});

let fbApp,auth,db,ready=false;
let user=null,uid=null,isAdmin=false,authMode='in';
let S=null,run=null,saveOk=null,lastSave=null,pushTimer=null;
let content=[],pg='login',cur=null;
let userRefOff=null,contentRefOff=null;

const dlg=(m,y='ยืนยัน',n='ยกเลิก')=>new Promise(res=>{const e=$('#dlg');e.innerHTML=`<div class="ov" style="align-items:center;padding:20px"><div class="gb" style="border-radius:22px;max-width:380px;max-height:none;padding:20px"><div style="white-space:pre-wrap;line-height:1.7">${esc(m)}</div><div style="display:grid;grid-template-columns:${n?'1fr 1fr':'1fr'};gap:10px;margin-top:16px">${n?`<button class="btn" id="dn">${n}</button>`:''}<button class="btn pri" id="dy">${y}</button></div></div></div>`;const c=v=>{e.innerHTML='';res(v)};$('#dy').onclick=()=>c(true);if(n)$('#dn').onclick=()=>c(false)});
const say=m=>dlg(m,'ตกลง',null);
async function cp(c){let ok=false;try{await navigator.clipboard.writeText(c);ok=true}catch(e){}
 if(!ok){try{const t=document.createElement('textarea');t.value=c;t.style.cssText='position:fixed;opacity:0';document.body.appendChild(t);t.select();ok=document.execCommand('copy');t.remove()}catch(e){}}
 if(!ok)say('คัดลอกอัตโนมัติไม่ได้ กดค้างที่ข้อความแล้วเลือกคัดลอก')}

// ---------- auth ----------
function fbErr(c){return ({'auth/invalid-email':'อีเมลไม่ถูกต้อง','auth/user-not-found':'ไม่พบบัญชีนี้','auth/wrong-password':'รหัสผ่านไม่ถูกต้อง','auth/invalid-credential':'อีเมลหรือรหัสผ่านไม่ถูกต้อง','auth/email-already-in-use':'อีเมลนี้ถูกใช้สมัครแล้ว','auth/weak-password':'รหัสผ่านสั้นเกินไป (อย่างน้อย 6 ตัว)','auth/too-many-requests':'ลองผิดหลายครั้งเกินไป รอสักครู่แล้วลองใหม่','auth/network-request-failed':'เชื่อมต่อเครือข่ายไม่ได้'})[c]||('เกิดข้อผิดพลาด ('+(c||'unknown')+')')}
async function doAuth(){const email=$('#lem').value.trim(),pw=$('#lpw').value,er=$('#lerr'),bt=$('#lbtn');er.textContent='';
 if(!email||!pw){er.textContent='กรอกอีเมลและรหัสผ่าน';return}
 bt.disabled=true;try{if(authMode==='up')await auth.createUserWithEmailAndPassword(email,pw);else await auth.signInWithEmailAndPassword(email,pw)}catch(e){er.textContent=fbErr(e.code)}bt.disabled=false}
async function forgotPw(){const email=($('#lem')&&$('#lem').value.trim())||'';if(!email){say('กรอกอีเมลในช่องด้านบนก่อน แล้วกดลืมรหัสผ่านอีกครั้ง');return}
 try{await auth.sendPasswordResetEmail(email);say('ส่งลิงก์รีเซ็ตรหัสผ่านไปที่ '+email+' แล้ว (เช็กเมล/ถังขยะ)')}catch(e){say(fbErr(e.code))}}
async function logout(){if(!(await dlg('ออกจากระบบ?','ออกจากระบบ')))return;await flush();detachAll();auth.signOut()}
function vLogin(){return `<div class="card" style="margin-top:0;text-align:center;padding:28px 18px">
 <div style="font-size:44px">🎮</div><b class="n" style="display:block;margin-top:6px;font-size:19px">ROV Point Hub</b><div class="mut" style="margin-top:4px">เข้าสู่ระบบเพื่อเริ่มสะสมคะแนน · ข้อมูลจะผูกกับบัญชีนี้ถาวร</div>
 <div style="text-align:left;margin-top:18px"><label class="mut">อีเมล</label><input id="lem" type="email" autocomplete="email" class="inp" placeholder="you@example.com">
 <label class="mut" style="display:block;margin-top:10px">รหัสผ่าน</label><input id="lpw" type="password" autocomplete="current-password" class="inp" placeholder="อย่างน้อย 6 ตัวอักษร"></div>
 <div style="color:#d32f2f;font-size:13px;margin-top:10px;min-height:18px" id="lerr"></div>
 <button class="btn pri" id="lbtn" style="width:100%;margin-top:4px" onclick="doAuth()">${authMode==='up'?'สมัครสมาชิก':'เข้าสู่ระบบ'}</button>
 <div class="mut" style="margin-top:14px">${authMode==='up'?'มีบัญชีแล้ว?':'ยังไม่มีบัญชี?'} <button class="chip" onclick="authMode=authMode==='up'?'in':'up';R()">${authMode==='up'?'เข้าสู่ระบบ':'สมัครสมาชิก'}</button></div>
 ${authMode==='in'?`<button class="chip" style="margin-top:10px" onclick="forgotPw()">ลืมรหัสผ่าน?</button>`:''}</div>`}

// ---------- realtime user doc ----------
function attachUser(){userRefOff=db.ref('users/'+uid);
 userRefOff.on('value',snap=>{const v=snap.val();
  if(!v){S=fresh();pushUser(true);roll();R();return}
  if(S&&typeof v.ts==='number'&&v.ts<=S.ts){markSave(true);return}
  const keepRun=run;S=Object.assign(fresh(),v);run=keepRun;roll();R()
 },e=>{markSave(false)})}
function detachAll(){if(userRefOff)userRefOff.off();if(contentRefOff)contentRefOff.off();userRefOff=null;contentRefOff=null;S=null;content=[];run=null}
function markSave(ok){saveOk=ok;if(ok)lastSave=new Date();const e=$('#sv');if(e)e.textContent=ok===false?'⚠️ บันทึกไม่สำเร็จ (เช็กอินเทอร์เน็ต)':lastSave?'☁️ บันทึกถาวรแล้ว '+p2(lastSave.getHours())+':'+p2(lastSave.getMinutes())+':'+p2(lastSave.getSeconds()):''}
function save(){if(!S||!uid)return;S.ts=Date.now();if(pushTimer)return;pushTimer=setTimeout(()=>{pushTimer=null;pushUser()},900)}
async function pushUser(direct){if(!S||!uid)return;if(!direct&&pushTimer){clearTimeout(pushTimer);pushTimer=null}const d=clone(S);try{await db.ref('users/'+uid).set(d);markSave(true)}catch(e){markSave(false)}}
function flush(){return pushUser(true)}
function roll(){if(!S)return;if(S.day!==day()){S.day=day();S.done={};S.on=0;run=null;save()}}
function add(n,t){S.pts+=n;S.log.unshift({t:tstr(),m:t,n});S.log=S.log.slice(0,80);save()}

// ---------- realtime content ----------
function attachContent(){contentRefOff=db.ref('content');
 contentRefOff.on('value',snap=>{const v=snap.val()||{};content=Object.keys(v).map(id=>Object.assign({id},v[id])).sort((a,b)=>(b.ts||0)-(a.ts||0));
  if(['lib','home','view','admin'].includes(pg))R()},()=>{})}

// ---------- missions ----------
function claim(id){const m=M.find(x=>x.id===id);let n=m.p,t=m.n;
 if(id==='ci'){const y=new Date(Date.now()-864e5).toLocaleDateString('en-CA');S.streak=S.last===y?S.streak+1:1;S.last=day();
  if(S.streak%7===0){n+=5000;t+=' + โบนัสครบ 7 วัน'}}
 S.done[id]=(S.done[id]||0)+1;if(run&&run.id===id)run=null;add(n,t);R()}
function start(id){run={id,el:0};R()}
function stop(){run=null;R()}
function mission(m){const c=(S.done||{})[m.id]||0,full=c>=m.max,r=run&&run.id===m.id;
 const el=m.tot?S.on:(r?run.el:0),ready=m.s===0||el>=m.s;let b;
 if(full)b='<span class="chip ok">ครบวันนี้</span>';
 else if(ready)b=`<button class="btn gold" onclick="claim('${m.id}')">รับ +${fmt(m.p)}</button>`;
 else if(m.tot)b='<span class="chip wn" id="t-'+m.id+'">'+mm(S.on)+' / '+mm(m.s)+'</span>';
 else if(r)b=`<button class="btn" onclick="stop()">หยุด</button>`;
 else b=`<button class="btn pri" onclick="start('${m.id}')">เริ่ม</button>`;
 return `<div class="card"><div class="row"><div class="gap"><span class="em">${m.e}</span><div style="min-width:0"><b class="n">${m.n}</b><div class="mut">${m.d}</div><div class="mut">+${fmt(m.p)} คะแนน · วันนี้ ${c}/${m.max}</div></div></div>${b}</div>
 ${(m.s&&!full&&(r||m.tot))?`<div class="bar"><i id="b-${m.id}" style="width:${Math.min(100,el/m.s*100)}%"></i></div>${r?`<div class="mut" style="margin-top:6px" id="t-${m.id}">${mm(el)} / ${mm(m.s)}</div>`:''}`:''}</div>`}
function spin(){if(S.done.wheel)return;let r=Math.random()*100,p=5;for(const [v,w] of WH){if(r<w){p=v;break}r-=w}S.done.wheel=1;add(p,'หมุนวงล้อรายวัน');R();say('🎡 ได้ '+fmt(p)+' คะแนน!')}
const seenN=()=>Object.keys(S.seen).length;
const MS=[['oid','🆔','ตั้งค่า ROV Open ID','กรอกครั้งแรก',50,()=>S.oid?1:0,1],['s3','🔥','เช็กอินติดกัน 3 วัน','',300,()=>S.streak,3],['s14','🔥','เช็กอินติดกัน 14 วัน','',3000,()=>S.streak,14],['s30','🔥','เช็กอินติดกัน 30 วัน','',10000,()=>S.streak,30],
['c3','📚','ดู/อ่านเนื้อหาในคลัง 3 รายการ','',200,seenN,3],['c10','📚','ดู/อ่านเนื้อหาในคลัง 10 รายการ','',1000,seenN,10],['l10','⏱️','ออนไลน์สะสม 10 ชั่วโมง','',2000,()=>S.life/3600,10],['l50','⏱️','ออนไลน์สะสม 50 ชั่วโมง','',10000,()=>S.life/3600,50]];
function msClaim(id){const m=MS.find(x=>x[0]===id);if(!m||S.ms[id]||m[5]()<m[6])return;S.ms[id]=1;add(m[4],m[2]);R()}
function msCard(m){const [id,e,n,d,p,f,t]=m,c=Math.min(f(),t),ok=c>=t,dn=S.ms[id];
 return `<div class="card"><div class="row"><div class="gap"><span class="em">${e}</span><div style="min-width:0"><b class="n">${n}</b><div class="mut">+${fmt(p)} คะแนน · ${Math.floor(c)}/${t}${d?' · '+d:''}</div></div></div>${dn?'<span class="chip ok">รับแล้ว ✓</span>':ok?`<button class="btn gold" onclick="msClaim('${id}')">รับ +${fmt(p)}</button>`:`<span class="chip">${Math.floor(c/t*100)}%</span>`}</div>${dn||ok?'':`<div class="bar"><i style="width:${c/t*100}%"></i></div>`}</div>`}
function vM(){return '<div class="mut" style="margin:14px 4px 0">เลือก "เริ่ม" แล้วเปิดหน้านี้ค้างไว้ · เวลาจะนับเฉพาะตอนที่อยู่ในหน้านี้ · ทำได้ครั้งละ 1 ภารกิจ</div>'
 +`<div class="card"><div class="row"><div class="gap"><span class="em">🎡</span><div><b class="n">วงล้อรายวัน</b><div class="mut">หมุนได้วันละ 1 ครั้ง · ได้ 5–1,000 คะแนน</div></div></div>${S.done.wheel?'<span class="chip ok">หมุนแล้ววันนี้</span>':'<button class="btn gold" onclick="spin()">หมุน</button>'}</div></div>`
 +M.map(mission).join('')+'<div class="mut" style="margin:18px 4px 0">🏆 เป้าหมายสะสม (รับได้ครั้งเดียว)</div>'+MS.map(msCard).join('')}

// ---------- redeem ----------
function vR(){const nx=T.find(t=>S.pts<t[1]);
 let h=`<div class="card"><b class="n">แลกคะแนนเป็นคูปอง ROV</b><div class="mut">${nx?`อีก ${fmt(nx[1]-S.pts)} คะแนน จะแลก ${nx[0]} คูปองได้`:'คะแนนพอแลกได้ทุกระดับแล้ว'}</div></div>`;
 T.forEach(([q,c])=>{const ok=S.pts>=c;h+=`<div class="card"><div class="row"><div class="gap"><span class="em">🎟️</span><div><b class="n">${q} คูปอง</b><div class="mut">${fmt(c)} คะแนน</div></div></div>

async function redeem(q,c){if(S.pts<c)return;if(!S.oid){await say('กรอก ROV Open ID ก่อนแลกคูปอง');eo=true;pg='home';R();return}
 if(!(await dlg('ใช้ '+fmt(c)+' คะแนน แลก '+q+' คูปอง\nให้ Open ID: '+S.oid+' ?')))return;if(S.pts<c)return;
 const ch='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',g=n=>Array.from({length:n},()=>ch[Math.floor(Math.random()*ch.length)]).join('');
 const code='ROV-'+g(4)+'-'+g(4);S.my.unshift({t:tstr(),q,code,oid:S.oid});add(-c,'แลก '+q+' คูปอง ('+code+') ID '+S.oid);pg='mine';R()}

<div class="card"><b class="n">ประวัติคะแนน</b><table class="tbl">${S.log.map(x=>`<tr><td class="mut" width="90">${x.t}</td><td>${x.m}</td><td align="right"><b style="color:${x.n<0?'#d32f2f':'var(--okt)'}">${x.n>0?'+':''}${fmt(x.n)}</b></td></tr>`).join('')||'<tr><td class="mut">ยังไม่มีประวัติ</td></tr>'}</table></div>`}

 S.oid=v;eo=false;save();R()}

 const d=!!S.seen[c.id],q=Math.min(S.cp[c.id]||0,c.sec),rd=q>=c.sec;

 <div class="card"><div class="row"><b class="n">ความคืบหน้า</b>${d?'<span class="chip ok">รับแล้ว ✓</span>':rd?`<button class="btn gold" onclick="claimC('${c.id}')">รับ +${fmt(c.pts)}</button>`:`<span class="chip wn" id="ct2">${mm(q)} / ${mm(c.sec)}</span>`}</div><div class="bar"><i id="cb2" style="width:${d?100:Math.min(100,q/c.sec*100)}%"></i></div></div>`}

 return `<div class="card" style="margin-top:0"><b class="n">เพิ่มเนื้อหาใหม่ (เผยแพร่จริงทันที)</b><div class="mut" style="margin-top:4px">อัปโหลดแล้วผู้เล่นทุกคนที่เปิดหน้าอยู่จะเห็นทันทีโดยไม่ต้องรีเฟรช</div>

function readB64(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}
async function addContent(){const st=$('#ast'),bt=$('#abtn');const type=$('#at').value,title=$('#ati').value.trim(),body=$('#abd').value.trim(),f=$('#af').files[0];let pts=Math.round(+$('#ap').value),sec=Math.round(+$('#as').value);
 if(!title){st.textContent='กรอกหัวข้อ';return}if(type!=='news'&&!f){st.textContent='เลือกไฟล์ก่อน';return}if(type==='news'&&!body){st.textContent='กรอกเนื้อหาข่าว';return}
 if(f&&type==='video'&&!f.type.startsWith('video/')||f&&type==='image'&&!f.type.startsWith('image/')){st.textContent='ชนิดไฟล์ไม่ตรงกับประเภท';return}
 if(!(pts>=5&&pts<=10000)||!(sec>=5&&sec<=7200)){st.textContent='คะแนน 5–10,000 / เวลา 5–7,200 วินาที';return}
 const cap=type==='video'?4:2;if(f&&f.size>cap*1048576){st.textContent='ไฟล์เกิน '+cap+'MB (แพ็กเกจฟรีเก็บไฟล์เล็กเท่านั้น)';return}
 bt.disabled=true;try{const id='c'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);let url='';
  if(f){st.textContent='กำลังแปลงไฟล์...';url=await readB64(f)}
  await db.ref('content/'+id).set({type,title,body,url,pts,sec,ts:firebase.database.ServerValue.TIMESTAMP});
  st.textContent='✅ เผยแพร่แล้ว ผู้เล่นทุกคนเห็นทันที';['#ati','#abd'].forEach(x=>$(x).value='');$('#af').value=''}
 catch(e){st.textContent='ผิดพลาด: '+((e&&e.code)||'ลองใหม่ (ไฟล์อาจใหญ่เกินไป)')}bt.disabled=false}
async function delC(id){const c=content.find(x=>x.id===id);if(!c||!(await dlg('ลบ "'+c.title+'" ? (ลบถาวรจากทุกคน)','ลบ')))return;
 try{await db.ref('content/'+id).remove()}catch(e){say('ลบไม่สำเร็จ: '+((e&&e.code)||'ลองใหม่'))}}

setInterval(()=>{if(!S||document.visibilityState!=='visible')return;roll();S.on++;S.life=(S.life||0)+1;{const e=$('#onl');if(e)e.textContent='ออนไลน์วันนี้ '+mm(S.on)}

// ---------- boot ----------
function boot(){try{
  fbApp=firebase.initializeApp(FIREBASE_CONFIG);auth=firebase.auth();db=firebase.database();
  auth.onAuthStateChanged(u=>{user=u;
   if(!u){detachAll();pg='login';ready=true;R();return}
   uid=u.uid;isAdmin=(u.email||'').toLowerCase()===ADMIN_EMAIL.toLowerCase();
   attachUser();attachContent();if(pg==='login')pg='home';ready=true;R()});
 }catch(e){$('#v').innerHTML='<div class="card" style="margin-top:0"><b class="n">เชื่อมต่อ Firebase ไม่สำเร็จ</b><div class="mut" style="margin-top:6px">'+esc((e&&e.message)||'')+'</div></div>'}}
addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flush()});addEventListener('pagehide',flush);
boot();
